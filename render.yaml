projects:
  - name: sure
    environments:
      - name: production

        services:
          - type: web
            name: sure-website
            runtime: docker
            plan: starter
            region: oregon
            dockerfilePath: ./Dockerfile
            healthCheckPath: /up
            preDeployCommand: ./bin/rails db:prepare
            autoDeployTrigger: commit
            envVars:
              - key: RAILS_MAX_THREADS
                value: "3"
              - key: WEB_CONCURRENCY
                value: "2"
              - key: DATABASE_URL
                fromDatabase:
                  name: sure-db
                  property: connectionString
              - key: REDIS_CACHE_URL
                fromService:
                  name: sure-cache
                  type: keyvalue
                  property: connectionString
              - key: REDIS_QUEUE_URL
                fromService:
                  name: sure-queue
                  type: keyvalue
                  property: connectionString
              - fromGroup: sure-website-secrets

          - type: worker
            name: sure-worker
            runtime: docker
            plan: starter
            region: oregon
            dockerfilePath: ./Dockerfile
            dockerCommand: bundle exec sidekiq
            autoDeployTrigger: commit
            envVars:
              - key: RAILS_MAX_THREADS
                value: "3"
              - key: DATABASE_URL
                fromDatabase:
                  name: sure-db
                  property: connectionString
              - key: REDIS_CACHE_URL
                fromService:
                  name: sure-cache
                  type: keyvalue
                  property: connectionString
              - key: REDIS_QUEUE_URL
                fromService:
                  name: sure-queue
                  type: keyvalue
                  property: connectionString
              - fromGroup: sure-website-secrets

          - type: keyvalue
            name: sure-cache
            plan: starter
            region: oregon
            maxmemoryPolicy: allkeys-lru
            ipAllowList: []

          - type: keyvalue
            name: sure-queue
            plan: starter
            region: oregon
            maxmemoryPolicy: noeviction
            ipAllowList: []

        databases:
          - name: sure-db
            plan: basic-256mb
            region: oregon
            postgresMajorVersion: "18"
            ipAllowList: []

# The sure-website-secrets environment group is intentionally not defined here.
# A group defined in a Blueprint has its values overwritten on every sync, so
# create it in the Dashboard before applying this Blueprint:
#
#   SECRET_KEY_BASE        (use the Dashboard's generate button)
#   CONVERTKIT_API_KEY, CONVERTKIT_FORM_ID, CONVERTKIT_TAG_ID
#   FRED_API_KEY
#   PLAID_CLIENT_ID, PLAID_SECRET, PLAID_ENVIRONMENT
#   OPENAI_API_KEY, SEOBOT_API_KEY
#   SENTRY_DSN, POSTHOG_KEY
#   DISCORD_URL, SURE_ROADMAP_URL
