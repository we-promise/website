title: "Asset & Debt analysis"
cards:
  debt_paid_off:
    title: "Debt paid off"
    questions:
      - id: 1
        question: "How much debt have I paid off this year?"
        answer:
          - "$8,940 so far: $6,100 off your car loan and $2,840 off your credit cards."
      - id: 2
        question: "What's left?"
        answer:
          - "$18,300 on the car loan and $1,210 across two cards."
      - id: 3
        question: "What rates am I paying?"
        answer:
          - "The car loan is at 4.9% and your Sapphire card at 22.4% APR."
  liquid_net_worth:
    title: "Liquid net worth"
    questions:
      - id: 1
        question: "How much of my net worth is liquid?"
        answer:
          - "$48,700 of your $412,300 net worth is in cash and checking accounts, about 12%."
  interest_paid:
    title: "Interest paid"
    questions:
      - id: 1
        question: "How much have I paid in interest this year?"
        answer:
          - "$1,940: $1,150 of loan interest and $790 on your cards."
      - id: 2
        question: "How does that compare to last year?"
        answer:
          - "It's $410 less than this time last year, mostly because your card balances are lower."
  net_worth_change:
    title: "Net worth this quarter"
    questions:
      - id: 1
        question: "How did my net worth change this quarter?"
        answer:
          - "It's up $21,480 (+5.5%)."
          - "Investments added $15,900 and you paid $3,100 off your debts. Your home's estimated value rose $2,480."
  debt_to_assets:
    title: "Debt against assets"
    questions:
      - id: 1
        question: "How much of what I own is offset by debt?"
        answer:
          - "Your debts total $86,900 against $499,200 of assets, so about 17%."
