title: "Investment Evaluation"
cards:
  portfolio_overview:
    title: "What's in my portfolio"
    questions:
      - id: 1
        question: "What's in my portfolio right now?"
        answer:
          - "You hold 9 positions worth $186,420 across your brokerage account and IRA."
          - "VTI is the largest at 41%, then your target-date fund at 22% and VXUS at 18%."
          - "About 4% is sitting in cash."
  holdings_performance:
    title: "How my holdings did"
    questions:
      - id: 1
        question: "How have my holdings done this year?"
        answer:
          - "They're up $14,210 (+8.3%) since January."
          - "VTI gained the most (+$7,890). BND is the only one down, by $310."
      - id: 2
        question: "Which account is doing best?"
        answer:
          - "Your IRA is up 11.2% this year. The brokerage account is up 6.9%."
  dividends:
    title: "Dividends"
    questions:
      - id: 1
        question: "How much did I get in dividends last quarter?"
        answer:
          - "$612 across 5 holdings, most of it from VTI ($287) and SCHD ($166)."
  contributions:
    title: "Money going in"
    questions:
      - id: 1
        question: "How much have I invested this year?"
        answer:
          - "You moved $14,500 into your brokerage account and IRA since January, about $1,450 a month."
      - id: 2
        question: "And in crypto?"
        answer:
          - "$9,240 sits in crypto, about 2% of your net worth, split between your Coinbase account and a Bitcoin wallet."
