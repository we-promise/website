title: "Strategic Planning"
cards:
  budget_check:
    title: "Budget check-in"
    questions:
      - id: 1
        question: "How am I doing against this month's budget?"
        answer:
          - "You've spent $2,940 of $3,850 with 11 days to go."
          - "Groceries is $126 over. Everything else is on track."
      - id: 2
        question: "Move $200 from Shopping to Groceries."
        answer:
          - "Done. October's Shopping budget is now $300 and Groceries is $600."
  subscriptions:
    title: "Subscriptions"
    questions:
      - id: 1
        question: "Which subscriptions renew this month?"
        answer:
          - "Five: Netflix ($15.49 on the 4th), Spotify ($11.99 on the 12th), iCloud ($2.99 on the 15th), Adobe ($59.99 on the 21st) and the gym ($80 on the 28th)."
      - id: 2
        question: "How much is that a year?"
        answer:
          - "$2,033 a year at today's prices."
  rules:
    title: "Rules"
    questions:
      - id: 1
        question: "Create a rule for my Spotify charges."
        answer:
          - "I'll set any transaction whose name contains \"Spotify\" to Entertainment. That would match 14 past transactions."
          - "Want me to create it and apply it to those?"
      - id: 2
        question: "Yes, please."
        answer:
          - "Done. The rule is saved and 14 transactions are now in Entertainment."
  savings_rate:
    title: "Savings rate"
    questions:
      - id: 1
        question: "How much did we save each month this year?"
        answer:
          - "On average $1,540 a month, 21% of your income."
          - "March was the best month ($2,310). August was the lowest ($620), mostly travel."
